name: Auto Victor & Gold Vault - Acc 2 (gaylobucu)

on:
  workflow_dispatch:
  schedule:
    - cron: '18 */5 * * *'

concurrency:
  group: victor-acc2
  cancel-in-progress: true

jobs:
  run-victor-acc2:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Auto Victor & Gold Vault - Acc 2 (gaylobucu)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKFLOW_NAME: "victor_acc2.yml"
        run: |
          python auto_victor_goldvault.py --acc 2
